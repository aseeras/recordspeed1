name: iOS run

# Runs frontend/run-ios.sh (the same one-command launcher people use on their Macs) with the
# newest Xcode on the runner, then checks that the app actually launched and loaded events.
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ios-run.yml"

permissions:
  contents: read

jobs:
  simulator:
    name: Run in iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.aseeras.eventsboard
      SHOTS: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Run the launcher script
        run: bash frontend/run-ios.sh

      - name: Check the app launched and loaded events from the backend
        run: |
          mkdir -p "$SHOTS"
          UDID=$(xcrun simctl list devices booted | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$SHOTS/1-home.png"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "EventsBoard"' > "$SHOTS/app.log" 2>&1 || true
          if grep -q "Application failed to launch" "$SHOTS/app.log"; then
            grep -m5 "failed to launch" "$SHOTS/app.log"; exit 1
          fi
          xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID" \
            || { echo "The app is not running"; exit 1; }
          grep -m2 "localhost:3000/events" "$SHOTS/app.log" \
            || { echo "The app never requested events from the backend"; tail -n 50 "$SHOTS/app.log"; exit 1; }

      - name: Event detail and create screens
        run: |
          xcrun simctl openurl "$UDID" "eventsboard://events/2"
          sleep 6
          xcrun simctl io "$UDID" screenshot "$SHOTS/2-event-detail.png"
          xcrun simctl openurl "$UDID" "eventsboard://events/new"
          sleep 5
          xcrun simctl io "$UDID" screenshot "$SHOTS/3-new-event.png"

      - name: Demo mode when the backend is stopped
        run: |
          pkill -f "node app/index.js" || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 15
          xcrun simctl io "$UDID" screenshot "$SHOTS/4-demo-mode.png"
          xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID" \
            || { echo "The app is not running without the backend"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EventsBoard-screenshots
          path: |
            screenshots
            frontend/ios/build/xcodebuild.log
          if-no-files-found: ignore
